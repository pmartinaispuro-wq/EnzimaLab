<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EnzimaLab | Bioquímica I</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f2f6ff;background:#101827}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:18px 15px 65px}h1{font-size:clamp(27px,7vw,42px);margin:9px 0}h2{font-size:24px;margin:8px 0 15px}p{line-height:1.55}button,input{font:inherit}button{cursor:pointer;border:1px solid #64748b;background:#243449;color:white;border-radius:13px;padding:13px 15px;font-weight:700}button:active{transform:scale(.98)}button.primary{background:var(--accent,#14b8a6);border-color:transparent;color:#09111c}button:disabled{opacity:.45;cursor:not-allowed}.stack{display:grid;gap:10px}.panel{background:#1c293c;border:1px solid #35465d;border-radius:20px;padding:20px;margin:15px 0}.muted{color:#b9c9d9}.small{font-size:13px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.tag{font-size:12px;background:#30455b;border-radius:99px;padding:6px 10px}.choices{display:grid;gap:9px}.choices button{text-align:left;font-weight:550}.feedback{border-left:4px solid #fbbf24;background:#273341;padding:13px;margin:13px 0;border-radius:7px}.good{border-color:#34d399}.bad{border-color:#fb7185}.hidden{display:none}.tube{width:72px;height:135px;border:4px solid #9ba9bb;border-top:0;border-radius:0 0 27px 27px;margin:auto;position:relative;overflow:hidden}.liquid{position:absolute;bottom:0;width:100%;height:78%;background:rgba(250,197,44,var(--alpha,.1));transition:background .3s}.tube::before{content:'';position:absolute;top:0;left:-3px;right:-3px;border-top:4px solid #9ba9bb;z-index:1}.lab{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:center}.readout{font-size:29px;font-weight:800;font-variant-numeric:tabular-nums}input[type=number]{background:#0f1b2c;color:white;border:1px solid #64748b;padding:12px;border-radius:10px;width:100%}svg{width:100%;height:auto}.data{width:100%;border-collapse:collapse}.data th,.data td{border-bottom:1px solid #425268;padding:10px;text-align:left}#screen{min-height:400px}a{color:#7dd3fc}.footer{margin-top:25px;color:#91a3b7;font-size:12px;text-align:center}body.candy{--accent:#fb72b9;background:radial-gradient(circle at top,#552453,#18142a 60%)}body.alien{--accent:#9afa54;background:radial-gradient(circle at top,#244d4b,#0e1725 65%)}body.clinical{--accent:#40c7f5;background:radial-gradient(circle at top,#17446a,#101827 65%)}
</style></head><body><main><div class="top"><span class="tag">BIOQUÍMICA I · SIMULADOR</span><button id="home" class="hidden" onclick="goHome()">⌂ Inicio</button></div><h1>🧪 EnzimaLab</h1><div id="screen"><div class="panel"><h2>Elegí una misión</h2><p>Prepará una reacción de β-galactosidasa con ONPG, tomá alícuotas, medí absorbancias y calculá actividad.</p></div><div class="stack"><button style="text-align:left;padding:20px" onclick="start('candy')">🍬 <b>Caramelos mutantes</b><br>¡Salvá la fábrica!</button><button style="text-align:left;padding:20px" onclick="start('alien')">👽 <b>Intolerancia galáctica</b><br>¡Rescatá a la tripulación!</button><button style="text-align:left;padding:20px" onclick="start('clinical')">🔬 <b>BioLab</b><br>Control de calidad enzimático</button></div></div><div class="footer">Prototipo educativo · Datos simulados · β-galactosidasa / ONPG</div></main><script>
const missions={candy:{icon:'🍬',name:'Caramelos mutantes',sub:'¡Salvá la fábrica!',intro:'La fábrica de golosinas está en crisis: una reacción enzimática produce el compuesto amarillo que colorea los caramelos, pero nadie logra controlar su velocidad. Necesitamos medir correctamente la actividad antes de ajustar la producción.',goal:'Conseguí una medida válida de actividad para que la fábrica vuelva a funcionar.',end:'🍭 ¡Fábrica salvada! Tus medidas permiten controlar el proceso sin desbordes ni lotes fallidos.'},alien:{icon:'👽',name:'Intolerancia galáctica',sub:'¡Rescatá a la tripulación!',intro:'Una nave aterrizó de emergencia. Sus tripulantes necesitan una enzima para procesar un alimento terrestre. Antes de usarla, debemos medir su actividad y entender cómo afectan las condiciones experimentales.',goal:'Obtené una medida confiable y enviá el informe a la nave.',end:'🚀 ¡Tripulación rescatada! El informe de actividad llegó a tiempo y la nave puede despegar.'},clinical:{icon:'🔬',name:'BioLab',sub:'Control de calidad enzimático',intro:'Un laboratorio biotecnológico recibió una preparación de β-galactosidasa recombinante. El equipo necesita una determinación reproducible de actividad antes de continuar con su caracterización.',goal:'Medí la velocidad inicial y calculá las unidades de actividad de la preparación.',end:'📋 ¡Control aprobado! La preparación ya cuenta con una determinación fundamentada de actividad.'}};
let mission=null,stage=0,selectedEnzyme=0,readings=[],questionDone=false,score=0;const S=document.getElementById('screen');function html(x){S.innerHTML=x;scrollTo({top:0,behavior:'smooth'})}function goHome(){mission=null;document.body.className='';document.getElementById('home').classList.add('hidden');home()}function home(){html(`<div class="panel"><h2>Elegí una misión</h2><p>Vas a preparar una reacción de <b>β-galactosidasa con ONPG</b>, tomar alícuotas, detenerlas con carbonato, medir la absorbancia a 450 nm y calcular la actividad.</p><p class="muted small">Los datos y escenarios son simulados; los fundamentos del ensayo corresponden al trabajo práctico.</p></div><div class="stack">${Object.entries(missions).map(([id,m])=>`<button style="text-align:left;padding:20px" onclick="start('${id}')"><span style="font-size:30px">${m.icon}</span><br><b>${m.name}</b><br><span class="muted">${m.sub}</span></button>`).join('')}</div>`)}function start(id){mission=id;stage=0;score=0;selectedEnzyme=0;readings=[];document.body.className=id;document.getElementById('home').classList.remove('hidden');render()}
function shell(title,content){let m=missions[mission];html(`<div class="top"><span class="tag">${m.icon} ${m.name}</span><span class="tag">Etapa ${stage+1} de 6</span></div><div class="panel"><h2>${title}</h2>${content}</div>`)}function next(){stage++;render()}function question(title,prompt,opts,correct,why){shell(title,`<p>${prompt}</p><div class="choices" id="opts">${opts.map((o,i)=>`<button onclick="answer(${i},${correct},${JSON.stringify(why).replaceAll('"','&quot;')})">${o}</button>`).join('')}</div><div id="feedback"></div>`)}function answer(i,c,why){if(questionDone)return;questionDone=true;document.querySelectorAll('#opts button').forEach((b,j)=>{b.disabled=true;if(j===c)b.style.borderColor='#34d399';if(j===i&&j!==c)b.style.borderColor='#fb7185'});if(i===c)score++;document.getElementById('feedback').innerHTML=`<div class="feedback ${i===c?'good':'bad'}"><b>${i===c?'¡Correcto!':'No es la mejor opción.'}</b><p>${why}</p></div><button class="primary" onclick="questionDone=false;next()">Continuar →</button>`}
function render(){questionDone=false;let m=missions[mission];if(stage===0){shell('Tu misión',`<p>${m.intro}</p><p><b>Objetivo:</b> ${m.goal}</p><p>El ensayo usa ONPG como sustrato. La β-galactosidasa libera <b>o-nitrofenol (ONP)</b>, que en medio alcalino presenta color amarillo y puede cuantificarse por absorbancia.</p><button class="primary" onclick="next()">Entrar al laboratorio →</button>`)}else if(stage===1){question('Preparación del ensayo','Para obtener una velocidad de reacción interpretable, ¿cuál es la mejor estrategia?', ['Agregar enzima y medir una sola absorbancia al final, sin registrar el tiempo.','Iniciar la reacción de manera controlada y tomar alícuotas a tiempos conocidos.','Dejar la enzima toda la noche con el sustrato.'],1,'La velocidad se obtiene a partir de la variación de producto con el tiempo. Necesitamos tiempos definidos y, preferentemente, un tramo lineal inicial.')}else if(stage===2){question('Detener la reacción','Tomaste una alícuota de la reacción con ONPG. ¿Para qué se agrega carbonato de sodio?', ['Para aportar más sustrato y acelerar la reacción.','Para precipitar específicamente el ADN de la muestra.','Para elevar el pH, detener la actividad enzimática en estas condiciones y favorecer la forma amarilla del ONP.'],2,'El carbonato alcaliniza fuertemente el medio, detiene el ensayo y favorece la forma ionizada amarilla del ONP, que se mide a 450 nm.')}else if(stage===3){shell('Simulá tus mediciones',`<p>Elegí la cantidad relativa de enzima. En este simulador, una preparación excesivamente concentrada agota rápidamente el régimen lineal.</p><div class="choices"><button onclick="setup(0.5)">Preparación diluida (0,5×)</button><button onclick="setup(1)">Preparación de trabajo (1×)</button><button onclick="setup(3)">Preparación concentrada (3×)</button></div>`)}else if(stage===4){measurement()}else if(stage===5){calculation()}}
function setup(x){selectedEnzyme=x;readings=[];next()}function absorb(t){let base=.0025*t*selectedEnzyme;return Math.round((selectedEnzyme===3?0.78*(1-Math.exp(-base/0.78)):base)*1000)/1000}function measurement(){let times=[60,120,180],done=readings.length;shell('Espectrofotómetro virtual',`<p>Tomá alícuotas a los tiempos indicados. Cada una se detiene con carbonato antes de medir a <b>450 nm</b>.</p><div class="lab"><div><div class="tube"><div class="liquid" style="--alpha:${done?Math.min(.9,readings[done-1].a/.6):.07}"></div></div><p class="small muted" style="text-align:center">Tubo de lectura</p></div><div><span class="muted small">Última absorbancia</span><div class="readout">${done?readings[done-1].a.toFixed(3):'—'}</div><span class="muted small">A₄₅₀</span></div></div><table class="data"><tr><th>Tiempo</th><th>A₄₅₀</th></tr>${times.map((t,i)=>`<tr><td>${t} s</td><td>${readings[i]?readings[i].a.toFixed(3):'—'}</td></tr>`).join('')}</table><div class="stack" style="margin-top:15px">${done<3?`<button class="primary" onclick="take()">Tomar alícuota a ${times[done]} s</button>`:`<button class="primary" onclick="next()">Analizar resultados →</button>`}</div>`)}function take(){let t=[60,120,180][readings.length];readings.push({t,a:absorb(t)});measurement()}
function calculation(){let slope=(readings[2].a-readings[0].a)/120;let linear=Math.abs((readings[1].a-readings[0].a)-(readings[2].a-readings[1].a))<.025;let activity=slope*(.160/.100)*(.0013)*1e6/(4500*.5)*60; // Lambert-Beer; corrected stop dilution; total reaction activity in micromol/min
let correct=activity.toFixed(2);shell('Interpretá los resultados',`<p>Estos son tus datos. La pendiente entre 60 y 180 s es <b>${slope.toFixed(5)} A/s</b>.</p><svg viewBox="0 0 340 205" role="img" aria-label="Gráfico de absorbancia versus tiempo"><line x1="40" y1="15" x2="40" y2="175" stroke="#9fb1c6"/><line x1="40" y1="175" x2="320" y2="175" stroke="#9fb1c6"/><text x="5" y="15" fill="#cbd5e1" font-size="11">A450</text><text x="242" y="195" fill="#cbd5e1" font-size="11">Tiempo (s)</text><polyline points="${readings.map(r=>`${40+r.t*1.4},${175-r.a*180}`).join(' ')}" fill="none" stroke="#facc15" stroke-width="3"/>${readings.map(r=>`<circle cx="${40+r.t*1.4}" cy="${175-r.a*180}" r="5" fill="#facc15"/>`).join('')}</svg><div class="feedback ${linear?'good':'bad'}"><b>${linear?'Los datos son aproximadamente lineales.':'La curva perdió linealidad.'}</b><p>${linear?'Podés estimar una velocidad a partir de este intervalo.':'La pendiente depende del intervalo elegido. Conviene diluir la enzima y repetir el ensayo antes de informar una actividad confiable.'}</p></div>${linear?`<p><b>Calculá la actividad (UI) de la mezcla de reacción.</b> Datos: ε₄₅₀ = 4500 M⁻¹ cm⁻¹; paso óptico = 0,5 cm; alícuota = 100 µL; volumen final de lectura = 160 µL; reacción original = 1300 µL. 1 UI = 1 µmol/min.</p><label for="result">Actividad calculada (UI)</label><input id="result" type="number" inputmode="decimal" step="any" placeholder="Ej.: 1,23"><div id="calcfeedback" style="margin-top:10px"></div><button class="primary" style="margin-top:12px" onclick="checkCalc(${activity})">Comprobar cálculo</button>`:`<button class="primary" onclick="stage=3;render()">Repetir con otra dilución</button>`}`)}function checkCalc(v){let input=document.getElementById('result'),n=Number(input.value.replace(',','.'));if(!input.value||!Number.isFinite(n)){document.getElementById('calcfeedback').innerHTML='<div class="feedback bad">Ingresá un número.</div>';return}let ok=Math.abs(n-v)<Math.max(.04,v*.07);document.getElementById('calcfeedback').innerHTML=`<div class="feedback ${ok?'good':'bad'}">${ok?'¡Muy bien!':'Revisá los factores de conversión.'} <b>Resultado esperado: ${v.toFixed(2)} UI.</b><p>Convertí A/s a mol/L/s con Lambert-Beer; corregí la dilución por el stop (160/100), multiplicá por el volumen de reacción (1,3 mL) y convertí a µmol/min. Esta actividad corresponde a toda la mezcla de reacción, no a UI/mL de la preparación original.</p></div><div class="panel"><h2>${missions[mission].end}</h2><p>Completaste el prototipo de actividad enzimática. Puntaje conceptual: ${score}/2.</p><button class="primary" onclick="goHome()">Elegir otra misión</button></div>`;input.disabled=true;document.querySelector('#calcfeedback + button').disabled=true}
try { home(); } catch (e) { console.error('Error al iniciar EnzimaLab:', e); }
</script></body></html>
